[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoramic-features"
version = "1.0.0"
description = "Third-molar / mandibular canal feature extraction from annotated panoramic radiographs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Berkay Ahmet Durmuş" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "XlsxWriter>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "openpyxl>=3.1", "matplotlib>=3.7"]

[project.scripts]
panoramic-features = "panoramic_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
